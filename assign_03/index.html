<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Student Result Manager</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <p>VSEC LAB / 03</p>
      <h1>Student Result Manager</h1>
    </header>
    <main id="main">
      <p>Enter three subject marks out of 100. Records stay in this tab until refreshed.</p>
      <form id="form">
        <label>Student name<input name="name" type="text" required maxlength="80">
        </label>
        <label>Roll number<input name="roll" type="text" required maxlength="30">
        </label>
        <div class="grid">
          <label>HTML<input name="mark0" type="number" required min="0" max="100" step="0.01">
          </label>
          <label>CSS<input name="mark1" type="number" required min="0" max="100" step="0.01">
          </label>
          <label>JavaScript<input name="mark2" type="number" required min="0" max="100" step="0.01">
          </label>
        </div>
        <button>Add result</button>
        <p id="message" role="status">
        </p>
      </form>
      <output id="topper" aria-live="polite">No results yet.</output>
      <div class="table-wrap">
        <table>
          <caption>Student results</caption>
          <thead>
            <tr>
              <th>Name</th>
              <th>Roll</th>
              <th>Total / 300</th>
              <th>Percentage</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="records">
          </tbody>
        </table>
      </div>
    </main>
    <footer>VSEC practical • Student learning demonstration</footer>
    <script type="module" src="app.js">
    </script>
  </body>
</html>
